name: my_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.1.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  fl_chart: ^1.1.1
  intl: ^0.20.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  flutter_timezone: ^3.0.0
  google_generative_ai: ^0.4.7
  home_widget: ^0.7.0
  workmanager: ^0.9.0
  confetti: ^0.7.0
  audioplayers: ^6.0.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

# ==========================================
# CẤU HÌNH FLUTTER (Assets, Fonts,...)
# ==========================================
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/

# ==========================================
# CẤU HÌNH MÀN HÌNH CHỜ (SPLASH SCREEN)
# (Lưu ý: Phải nằm sát lề trái, ngang hàng với 'flutter')
# ==========================================
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  branding: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#FFFFFF"
  web: false

# ==========================================
# CẤU HÌNH ICON APP (LAUNCHER ICON)
# (Lưu ý: Phải nằm sát lề trái, ngang hàng với 'flutter')
# ==========================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"